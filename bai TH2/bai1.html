<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="bai1.css">
    
<body>

<div class="container">
    <h3>Get in touch with us by filling contact form below</h3>

    <form>
        <!-- Row 1 -->
        <div class="row">
            <input type="text" placeholder="* Enter your full name">
            <input type="email" placeholder="* Enter your email address">
        </div>

        <!-- Subject -->
        <input type="text" placeholder="Enter your subject" class="full">

        <!-- Message -->
        <textarea placeholder="* Your message here..." class="full"></textarea>

        <!-- Footer -->
        <div class="footer">
            <button type="submit">Send message</button>
            <p>* Please fill all required form field, thanks!</p>
        </div>
    </form>
</div>

</body>
</html>
