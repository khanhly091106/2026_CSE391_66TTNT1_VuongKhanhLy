<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Form đăng ký</title>
    <link rel="stylesheet" href="bai2.1.css">
</head>
<body>
    <div class="container">
        <h2>Đăng ký tài khoản</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="fullname">
                <div class="error" id="fullname-error"></div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="text" id="email">
                <div class="error" id="email-error"></div>
            </div>
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" id="phone">
                <div class="error" id="phone-error"></div>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password">
                <div class="error" id="password-error"></div>
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword">
                <div class="error" id="confirm-error"></div>
            </div>
            <div class="form-group">
                <label>Giới tính</label><br>
                <input type="radio" name="gender" value="Nam"> Nam
                <input type="radio" name="gender" value="Nữ"> Nữ
                <div class="error" id="gender-error"></div>
            </div>
            <div class="form-group">
                <input type="checkbox" id="terms">
                <label>Tôi đồng ý điều khoản</label>
                <div class="error" id="terms-error"></div>
            </div>
            <button type="submit">Đăng ký</button>
        </form>
    </div>
    <div id="success-message"></div>
    <script src="bai2.1.js"></script>
</body>
</html>
