<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giao Diện Quản Lý Điểm</title>
    <link rel="stylesheet" href="bai1.2.css">
</head>

<body>

    <div class="wrapper">
        <h2>QUAN LY DIEM SINH VIEN</h2>

        <!-- TÌM KIẾM + LỌC -->
        <div class="tools">
            <input 
                type="text" 
                id="search" 
                placeholder="Tìm kiếm sinh viên..."
            >

            <select id="filter">
                <option value="all">Tất cả</option>
                <option value="Giỏi">Giỏi</option>
                <option value="Khá">Khá</option>
                <option value="Trung bình">Trung bình</option>
                <option value="Yếu">Yếu</option>
            </select>
        </div>

        <!-- FORM THÊM -->
        <div class="input-form">
            <input type="text" placeholder="Nhập họ tên..." id="name">
            <input type="number" placeholder="Điểm (0-10)" id="score" min="0" max="10">
            <button class="btn-add" id="add-btn">Thêm</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Họ tên</th>
                    <th id="score-header">Điểm ▲</th>
                    <th>Xếp loại</th>
                    <th>Thao tác</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>Nguyễn Văn A</td>
                    <td>8.5</td>
                    <td class="label-good">Giỏi</td>
                    <td><button class="btn-del">Xóa</button></td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Trần Thị B</td>
                    <td>4.0</td>
                    <td class="label-bad">Yếu</td>
                    <td><button class="btn-del">Xóa</button></td>
                </tr>
            </tbody>
        </table>

    </div>

<script src="bai1.2.js"></script>

</body>
</html>
