<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form đăng ký</title>
    <link rel="stylesheet" href="bai3.css">
</head>
<body>
    <div class="container">
        <h2>Đăng ký tài khoản</h2>
        <form id="registerForm">
            <!-- Họ tên -->
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="fullname" maxlength="50">
                <!-- bộ đếm ký tự -->
                <div id="name-counter">0/50</div>
                <div class="error" id="fullname-error"></div>
            </div>
            <!-- Email -->
            <div class="form-group">
                <label>Email</label>
                <input type="text" id="email">
                <div class="error" id="email-error"></div>
            </div>
            <!-- Số điện thoại -->
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" id="phone">
                <div class="error" id="phone-error"></div>
            </div>
            <!-- Mật khẩu -->
            <div class="form-group">
                <label>Mật khẩu</label>
                <!-- input + nút hiện mật khẩu -->
                <div class="password-box">
                    <input type="password" id="password">
                    <span id="togglePassword">👁</span>
                </div>
                <!-- thanh strength -->
                <div class="strength-bar">
                    <div id="strength"></div>
                </div>
                <div id="strength-text"></div>
                <div class="error" id="password-error"></div>
            </div>
            <!-- Xác nhận mật khẩu -->
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword">
                <div class="error" id="confirm-error"></div>
            </div>
            <!-- Giới tính -->
            <div class="form-group">
                <label>Giới tính</label>
                <input type="radio" name="gender" value="Nam"> Nam
                <input type="radio" name="gender" value="Nữ"> Nữ
                <div class="error" id="gender-error"></div>
            </div>
            <!-- Điều khoản -->
            <div class="form-group">
                <input type="checkbox" id="terms">
                <label>Tôi đồng ý điều khoản</label>
                <div class="error" id="terms-error"></div>
            </div>
            <button type="submit">Đăng ký</button>
        </form>
    </div>
    <!-- thông báo thành công -->
    <div id="success-message"></div>
    <!-- file JS -->
    <script src="bai3.js"></script>
</body>
</html>
